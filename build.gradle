plugins { id 'fabric-loom' version '1.11.8'; id 'maven-publish' }
version = '1.0.0'
group = 'dev.chromeflight'
base { archivesName = 'portalflight' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.11'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.17.3'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
